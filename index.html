<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviesFlix</title>
    <link rel="icon" type="image/favIcon" href="images/favIcon.gif">
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <section id="popup_Warp" class="hide">
    </section>

    <section id="navBar">
        <div class="nav_Container">
            <a>Movies<span>Flix</span></a>
        </div>

    </section>

    <section class="advFilters">
        <input type="text" class="popSearchInp" placeholder="Search Here..." tabindex="1" autocomplete="on"
            autofocus="on">
        <select name="Category" tabindex="2">
            <option value="multi" selected>Category</option>
            <option value="movie">Movie</option>
            <option value="tv">Series</option>
        </select>

        <button class="filterbtn" tabindex="3">Search</button>
    </section>

    <section id="mainWrap">
        <div class="contWrap trending" data-category="Trending" data-media-type="multi"></div>
        <div class="contWrap trendingMovie" data-category="trendingMovie" data-media-type="movie"></div>
        <div class="contWrap trendingTv" data-category="trendingTv" data-media-type="tv"></div>
        <div class="contWrap toplistedMovies" data-category="ToplistedMovies" data-media-type="movie"></div>
        <div class="contWrap toplistedSeries" data-category="ToplistedSeries" data-media-type="tv"></div>
    </section>

    <section id="innerDetailpage"></section>

    <section id="searchResult">
        <div class="contWrap searchResult" data-category="searchResult" data-media-type="multi"></div>
    </section>


    <section id="photoGallery"></section>
    <section id="videoGallery"></section>

    <footer>
        <span style="display:flex; align-items:center; gap:4px;">
            Created by
            <a href="https://github.com/Aryanvaish" target="_blank" rel="noopener noreferrer">
                Aryan Vaish
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

                        d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.11.82-.26.82-.577v-2.2c-3.338.726-4.033-1.416-4.033-1.416-.546-1.386-1.333-1.755-1.333-1.755-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.238 1.84 1.238 1.07 1.834 2.807 1.304 3.492.997.108-.775.42-1.304.763-1.604-2.665-.304-5.466-1.333-5.466-5.932 0-1.31.467-2.382 1.235-3.222-.124-.303-.536-1.527.117-3.176 0 0 1.008-.323 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.288-1.553 3.293-1.23 3.293-1.23.655 1.649.243 2.873.12 3.176.77.84 1.233 1.912 1.233 3.222 0 4.61-2.805 5.625-5.476 5.921.431.372.815 1.102.815 2.222v3.293c0 .32.218.694.825.576C20.565 21.796 24 17.296 24 12c0-6.63-5.373-12-12-12z">

                </svg>
            </a>
        </span>
        <span class="small-text">© 2024 MoviesFlix</span>
    </footer>


    <script type="module" src="info.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="./components/detailpopup.js"></script>
    <script type="module" src="./components/photogallery.js"></script>
    <script type="module" src="./components/videogallery.js"></script>
    <script type="module" src="./components/search.js"></script>


</body>

</html>
